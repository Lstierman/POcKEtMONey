name: Refresh catalog and prices
on:
  schedule:
    - cron: "17 5 * * *"   # daily, after the upstream price snapshots update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run refresh
      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Daily catalog and price refresh"
          git push
