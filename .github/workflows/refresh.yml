name: Refresh catalog and prices
on:
  schedule:
    - cron: "17 5 * * *"   # daily, after the upstream price snapshots update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run refresh
        env:
          # optional: a PriceCharting API token refreshes the graded prices; without it they stay as collected
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/card-map.json.gz data/tcgdex-products.json
          if [ -f data/pricecharting-live.json ]; then git add data/pricecharting-live.json; fi
          git diff --cached --quiet || git commit -m "Daily catalog and price refresh"
          git push
