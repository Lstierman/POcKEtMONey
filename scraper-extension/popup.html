<!doctype html>
<meta charset="utf-8">
<title>POcKEtMONey scraper</title>
<style>
  :root { --ink: #141a24; --mute: #5a6474; --line: #d3d9e2; --bg: #fbfcfd; --soft: #eef2fb; --blue: #2149c4; --ok: #157a3d; --warn: #b45309; --err: #b8322a; --gold: #c79a1e }
  * { box-sizing: border-box }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; width: 380px; margin: 0; padding: 14px; color: var(--ink); background: var(--bg) }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px }
  h1 img { width: 18px; height: 18px }
  h2 { font-size: 13px; margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: baseline }
  h2 small { color: var(--mute); font-weight: 400 }
  .helper { padding: 7px 10px; border-radius: 8px; background: var(--soft); color: var(--mute) }
  .helper b.ok { color: var(--ok) } .helper b.err { color: var(--err) }
  code { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px }
  button { height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 700; padding: 0 12px; cursor: pointer }
  button.pr { background: var(--blue); border-color: var(--blue); color: #fff }
  button.stop { background: #fff; border-color: var(--err); color: var(--err) }
  button:disabled { opacity: .45; cursor: default }
  input { height: 30px; border: 1.5px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; min-width: 0; width: 100% }
  .main { width: 100%; height: 40px; font-size: 14px; margin-top: 12px }
  .watch { border: 1.5px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden }
  .wl { max-height: 150px; overflow: auto }
  .wi { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--soft) }
  .wi .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .wi .p { color: var(--mute); font-variant-numeric: tabular-nums }
  .wi .x { height: 22px; width: 22px; padding: 0; border: 0; color: var(--mute); font-size: 16px; line-height: 1 }
  .wi .star { color: var(--gold) }
  .empty { padding: 8px; color: var(--mute) }
  .add { padding: 6px; border-top: 1px solid var(--line); position: relative }
  .sug { display: grid; gap: 2px; margin-top: 4px; max-height: 150px; overflow: auto }
  .sug button { text-align: left; height: auto; padding: 5px 7px; border: 0; background: var(--soft); font-weight: 400 }
  .sug small { color: var(--mute) }
  .site { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 7px 0; border-top: 1px solid var(--line) }
  .site .name { font-weight: 700 } .site .w { text-align: right; color: var(--mute); font-size: 12px }
  .site .when { color: var(--mute); font-size: 12px; grid-column: 1 / -1 }
  .bar { height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; grid-column: 1 / -1; margin-top: 3px } .bar i { display: block; height: 100%; background: var(--blue) }
  .job { margin-top: 10px; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; display: grid; gap: 6px }
  .job.waiting { border-color: var(--warn); background: #fffbeb }
  .job .msg { font-weight: 700 } .job.waiting .msg { color: var(--warn) }
  .job .cur { color: var(--ink); font-size: 12px; white-space: pre-line } .job .counts { color: var(--mute); font-size: 12px }
  .log { max-height: 110px; overflow: auto; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--mute); white-space: pre-wrap }
  .push { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center }
  .push .note { color: var(--mute); font-size: 12px }
  details { margin-top: 10px; color: var(--mute) } summary { cursor: pointer }
  details label { display: grid; gap: 3px; margin-top: 8px }
  details .chk { display: flex; gap: 6px; align-items: flex-start } details .chk input { width: auto; height: auto; margin-top: 2px }
  [hidden] { display: none !important }
</style>
<h1><img src="icon32.png" alt="">POcKEtMONey scraper</h1>
<div class="helper" id="helper">Checking the helper…</div>

<h2>To watch <small id="wcount"></small></h2>
<div class="watch">
  <div class="wl" id="wl"><div class="empty">Loading…</div></div>
  <div class="add"><input id="q" placeholder="Add a card: name, number or id (charizard 4/102)" spellcheck="false"><div class="sug" id="sug"></div></div>
</div>

<button class="pr main" id="go">Scrape all</button>

<div class="job" id="job" hidden>
  <div class="msg" id="msg"></div>
  <div class="cur" id="cur"></div>
  <div class="counts" id="counts"></div>
  <div class="log" id="log"></div>
</div>

<div id="sites"></div>

<div class="push">
  <div><b id="pending">Nothing waiting</b><div class="note" id="pushnote"></div></div>
  <button id="push">Push now</button>
</div>

<details>
  <summary>Advanced</summary>
  <label>Only these cards or sets (for testing; empty: To watch, then the catalog)
    <input id="only" placeholder="base1-4, sv3pt5" spellcheck="false"></label>
  <label class="chk"><input type="checkbox" id="deep"> <span>Every single Cardmarket offer (slow). Off: the cheapest offers of every language and condition.</span></label>
  <label>Helper address <input id="addr" value="http://127.0.0.1:8787" spellcheck="false"></label>
  <p>A separate window opens one tab per site; leave it open. If a site asks for a human check or a login, the window comes to the front and the run waits for you.</p>
</details>
<script src="popup.js"></script>
